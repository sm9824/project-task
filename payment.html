<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT TASK - Payment</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#2563eb);
padding:20px 15px;
}

.container{
max-width:500px;
margin:auto;
}

.header{
text-align:center;
color:white;
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.box{
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.20);
}

.selected{
text-align:center;
font-size:21px;
font-weight:bold;
margin-bottom:10px;
}

.amount{
text-align:center;
font-size:32px;
font-weight:bold;
color:#2563eb;
margin-bottom:25px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

select,
input{
width:100%;
padding:13px;
border:1px solid #cbd5e1;
border-radius:10px;
margin-bottom:16px;
font-size:16px;
}

.submit{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.submit:disabled{
background:#94a3b8;
cursor:not-allowed;
}

.message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.back{
display:block;
text-align:center;
color:white;
text-decoration:none;
font-weight:bold;
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
💳 PAYMENT
</div>

<div class="box">

<div class="selected" id="packageName">
Package
</div>

<div class="amount" id="amountText">
৳0
</div>

<label>Payment Method</label>

<select id="method">
<option value="">Select Method</option>
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
<option value="Bank">Bank</option>
</select>

<label>Sender Number / Account</label>

<input
type="text"
id="sender"
placeholder="Enter sender number/account"
>

<label>Transaction ID</label>

<input
type="text"
id="transactionId"
placeholder="Enter transaction ID"
>

<button class="submit" id="submitBtn">
SUBMIT PAYMENT
</button>

<div class="message" id="message"></div>

</div>

<a class="back" href="package.html">← Back to Packages</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyBwwSEUizTX5s_PxwQyatOk1LrDiNbaskA",
authDomain: "project-task-79e5b.firebaseapp.com",
projectId: "project-task-79e5b",
storageBucket: "project-task-79e5b.firebasestorage.app",
messagingSenderId: "5023785342",
appId: "1:5023785342:web:570310574c26d18dec532f",
measurementId: "G-77ZCVG3M0L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


const params = new URLSearchParams(window.location.search);

const packageNumber =
parseInt(params.get("package") || "0");

const amount =
parseInt(params.get("amount") || "0");


const packageName =
document.getElementById("packageName");

const amountText =
document.getElementById("amountText");

const submitBtn =
document.getElementById("submitBtn");

const message =
document.getElementById("message");


if(!packageNumber || !amount){

packageName.textContent = "No Package Selected";
amountText.textContent = "৳0";
submitBtn.disabled = true;

}else{

packageName.textContent =
"Package " + packageNumber;

amountText.textContent =
"৳" + amount.toLocaleString("en-US");

}


let currentUser = null;


onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

currentUser = user;

});


submitBtn.addEventListener("click",async()=>{

if(!currentUser){

message.textContent =
"Please login first.";

return;

}


const method =
document.getElementById("method").value.trim();

const sender =
document.getElementById("sender").value.trim();

const transactionId =
document.getElementById("transactionId").value.trim();


if(!packageNumber || !amount){

message.textContent =
"Please select a package.";

return;

}


if(!method){

message.textContent =
"Please select payment method.";

return;

}


if(!sender){

message.textContent =
"Please enter sender number/account.";

return;

}


if(!transactionId){

message.textContent =
"Please enter transaction ID.";

return;

}


submitBtn.disabled = true;

message.textContent =
"Checking payment...";


try{


const paymentRef =
collection(db,"payments");


const duplicateQuery =
query(
paymentRef,
where("transactionId","==",transactionId)
);


const duplicateSnapshot =
await getDocs(duplicateQuery);


if(!duplicateSnapshot.empty){

message.textContent =
"This Transaction ID has already been submitted.";

submitBtn.disabled = false;

return;

}


await addDoc(paymentRef,{

userId: currentUser.uid,

userEmail:
currentUser.email || "",

packageNumber:
packageNumber,

amount:
amount,

method:
method,

sender:
sender,

transactionId:
transactionId,

status:
"pending",

createdAt:
new Date().toISOString()

});


message.textContent =
"Payment submitted successfully. Waiting for admin approval.";

submitBtn.disabled = true;


}catch(error){

console.error(error);

message.textContent =
"Payment failed: " + error.message;

submitBtn.disabled = false;

}

});

</script>

</body>
</html>
