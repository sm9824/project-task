<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    .payment {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 12px 0;
    }

    .row {
      margin: 7px 0;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    button {
      border: 0;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px 5px 0 0;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .refresh {
      background: #2563eb;
      color: white;
    }

    .logout {
      background: #6b7280;
      color: white;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #eef2ff;
    }

    .empty {
      padding: 15px;
      text-align: center;
      color: #666;
    }

    .approved {
      color: #15803d;
      font-weight: bold;
    }

    .rejected {
      color: #dc2626;
      font-weight: bold;
    }

    .pending {
      color: #ca8a04;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>ADMIN PANEL</h1>
  </div>

  <div class="container">

    <div class="box">
      <div id="adminStatus" class="status">
        Admin যাচাই করা হচ্ছে...
      </div>

      <button class="refresh" onclick="loadPayments()">
        🔄 Refresh
      </button>

      <button class="logout" onclick="logout()">
        Logout
      </button>
    </div>

    <div class="box">
      <h2>💳 Payment Requests</h2>
      <div id="paymentsList">
        Loading...
      </div>
    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy,
      doc,
      getDoc,
      updateDoc,
      setDoc,
      where
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyBwwSEUizTX5s_PxwQyatOk1LrDiNbaskA",
      authDomain: "project-task-79e5b.firebaseapp.com",
      projectId: "project-task-79e5b",
      storageBucket: "project-task-79e5b.firebasestorage.app",
      messagingSenderId: "5023785342",
      appId: "1:5023785342:web:570310574c26d18dec532f",
      measurementId: "G-77ZCVG3M0L"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    // =========================
    // ADMIN UID
    // =========================

    const ADMIN_UID = "smfubqla1rGLWVDh857CueXeUEWYm2";


    // =========================
    // AUTH CHECK
    // =========================

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        location.href = "login.html";
        return;
      }

      if (user.uid !== ADMIN_UID) {

        document.getElementById("adminStatus").innerHTML =
          "❌ আপনি Admin নন।";

        setTimeout(() => {
          location.href = "dashboard.html";
        }, 1500);

        return;
      }

      document.getElementById("adminStatus").innerHTML =
        "✅ Admin হিসেবে লগইন করা আছে: " + escapeHtml(user.email);

      await loadPayments();

    });


    // =========================
    // LOAD PAYMENTS
    // =========================

    window.loadPayments = async function () {

      const list = document.getElementById("paymentsList");

      list.innerHTML = "Loading...";

      try {

        const q = query(
          collection(db, "payments"),
          orderBy("createdAt", "desc")
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {

          list.innerHTML =
            '<div class="empty">কোনো Payment পাওয়া যায়নি।</div>';

          return;
        }


        let html = "";

        snapshot.forEach((paymentDoc) => {

          const p = paymentDoc.data();

          const paymentId = paymentDoc.id;

          const status = p.status || "pending";

          let statusText = "";

          if (status === "approved") {
            statusText = '<span class="approved">APPROVED</span>';
          }
          else if (status === "rejected") {
            statusText = '<span class="rejected">REJECTED</span>';
          }
          else {
            statusText = '<span class="pending">PENDING</span>';
          }


          html += `

            <div class="payment">

              <div class="row">
                <span class="label">Payment ID:</span>
                ${escapeHtml(paymentId)}
              </div>

              <div class="row">
                <span class="label">User ID:</span>
                ${escapeHtml(p.userId || "")}
              </div>

              <div class="row">
                <span class="label">Email:</span>
                ${escapeHtml(p.userEmail || "")}
              </div>

              <div class="row">
                <span class="label">Package:</span>
                ${escapeHtml(String(p.packageNumber || ""))}
              </div>

              <div class="row">
                <span class="label">Amount:</span>
                ৳${escapeHtml(String(p.amount || 0))}
              </div>

              <div class="row">
                <span class="label">Payment Method:</span>
                ${escapeHtml(p.method || "")}
              </div>

              <div class="row">
                <span class="label">Payment Type:</span>
                ${escapeHtml(p.paymentType || "")}
              </div>

              <div class="row">
                <span class="label">Sender:</span>
                ${escapeHtml(p.sender || "")}
              </div>

              <div class="row">
                <span class="label">Transaction ID:</span>
                ${escapeHtml(p.transactionId || "")}
              </div>

              <div class="row">
                <span class="label">Status:</span>
                ${statusText}
              </div>

              ${
                status === "pending"
                ? `
                  <button
                    class="approve"
                    onclick="approvePayment('${paymentId}')">
                    ✅ APPROVE
                  </button>

                  <button
                    class="reject"
                    onclick="rejectPayment('${paymentId}')">
                    ❌ REJECT
                  </button>
                `
                : ""
              }

            </div>

          `;

        });


        list.innerHTML = html;


      } catch (error) {

        console.error(error);

        list.innerHTML =
          "❌ Payment load করতে সমস্যা হয়েছে:<br>" +
          escapeHtml(error.message);

      }

    };


    // =========================
    // APPROVE PAYMENT
    // =========================

    window.approvePayment = async function (paymentId) {

      if (!confirm("এই Payment Approve করবেন?")) {
        return;
      }

      try {

        const paymentRef = doc(db, "payments", paymentId);

        const paymentSnap = await getDoc(paymentRef);

        if (!paymentSnap.exists()) {
          alert("Payment পাওয়া যায়নি।");
          return;
        }


        const payment = paymentSnap.data();


        if (payment.status !== "pending") {

          alert("এই Payment ইতিমধ্যে processed হয়েছে।");

          await loadPayments();

          return;
        }


        const userId = payment.userId;

        const amount = Number(payment.amount || 0);

        const packageNumber = Number(payment.packageNumber || 0);


        if (!userId) {
          alert("Payment-এর User ID নেই।");
          return;
        }


        if (!amount) {
          alert("Payment-এর amount নেই।");
          return;
        }


        // =========================
        // USER CHECK
        // =========================

        const userRef = doc(db, "users", userId);

        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {

          alert(
            "এই Payment-এর User account পাওয়া যায়নি।"
          );

          return;
        }


        // =========================
        // 1. PAYMENT APPROVED
        // =========================

        await updateDoc(paymentRef, {

          status: "approved",

          approvedAt: new Date().toISOString(),

          approvedBy: auth.currentUser.uid

        });


        // =========================
        // 2. PACKAGE ACTIVE
        // =========================

        await updateDoc(userRef, {

          packageStatus: "active",

          packagePrice: amount,

          packageNumber: packageNumber,

          packagePurchasedAt:
            new Date().toISOString(),

          packagePaymentId: paymentId

        });


        // =========================
        // 3. REFERRAL SUCCESSFUL
        // =========================

        const referralQuery = query(
          collection(db, "referrals"),
          where("referredUid", "==", userId),
          where("status", "==", "pending")
        );


        const referralSnapshot =
          await getDocs(referralQuery);


        for (const referralDoc of referralSnapshot.docs) {

          await updateDoc(
            doc(db, "referrals", referralDoc.id),
            {

              status: "successful",

              successfulAt:
                new Date().toISOString(),

              successfulPaymentId:
                paymentId

            }
          );

        }


        alert(
          "✅ Payment Approved!\n\n" +
          "Package: " + packageNumber + "\n" +
          "Amount: ৳" + amount + "\n\n" +
          "User package Active হয়েছে।\n" +
          "Referral Successful হয়েছে।"
        );


        await loadPayments();


      } catch (error) {

        console.error(error);

        alert(
          "❌ Approve করতে সমস্যা হয়েছে:\n" +
          error.message
        );

      }

    };


    // =========================
    // REJECT PAYMENT
    // =========================

    window.rejectPayment = async function (paymentId) {

      if (!confirm("এই Payment Reject করবেন?")) {
        return;
      }


      try {

        const paymentRef =
          doc(db, "payments", paymentId);


        const paymentSnap =
          await getDoc(paymentRef);


        if (!paymentSnap.exists()) {

          alert("Payment পাওয়া যায়নি।");

          return;
        }


        const payment =
          paymentSnap.data();


        if (payment.status !== "pending") {

          alert("এই Payment ইতিমধ্যে processed হয়েছে।");

          await loadPayments();

          return;
        }


        await updateDoc(paymentRef, {

          status: "rejected",

          rejectedAt:
            new Date().toISOString(),

          rejectedBy:
            auth.currentUser.uid

        });


        alert("❌ Payment Rejected হয়েছে।");


        await loadPayments();


      } catch (error) {

        console.error(error);

        alert(
          "❌ Reject করতে সমস্যা হয়েছে:\n" +
          error.message
        );

      }

    };


    // =========================
    // LOGOUT
    // =========================

    window.logout = async function () {

      await signOut(auth);

      location.href = "login.html";

    };


    // =========================
    // HTML ESCAPE
    // =========================

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
