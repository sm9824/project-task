<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PROJECT TASK Dashboard</title><style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#2563eb);
padding:25px 15px;
}

.header{
text-align:center;
color:white;
font-size:30px;
font-weight:bold;
margin-bottom:25px;
}

.dashboard{
max-width:600px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:white;
border-radius:20px;
min-height:155px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
box-shadow:0 8px 25px rgba(0,0,0,.20);
cursor:pointer;
transition:.2s;
text-decoration:none;
color:#222;
}

.card:active{
transform:scale(.96);
}

.icon{
font-size:50px;
margin-bottom:12px;
}

.title{
font-size:19px;
font-weight:bold;
}

.commission{
grid-column:span 1;
}

.today{
grid-column:span 1;
}

.logout{
display:block;
width:100%;
max-width:600px;
margin:20px auto 0;
padding:14px;
border:0;
border-radius:12px;
background:#dc2626;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

@media(max-width:420px){

.card{
min-height:145px;
}

.icon{
font-size:44px;
}

.title{
font-size:17px;
}

}
</style></head>
<body>

<div class="header">
PROJECT TASK
</div>

<div class="dashboard">

<a class="card" href="package.html">
<div class="icon">📦</div>
<div class="title">PACKAGE</div>
</a>

<a class="card" href="task.html">
<div class="icon">📋</div>
<div class="title">TASK</div>
</a>

<a class="card" href="payment.html">
<div class="icon">💳</div>
<div class="title">PAYMENT</div>
</a>

<a class="card" href="referral.html">
<div class="icon">👥</div>
<div class="title">REFERRAL</div>
</a>

<a class="card commission" href="#">
<div class="icon">💰</div>
<div class="title">COMMISSION<br>INCOME</div>
</a>

<a class="card today" href="#">
<div class="icon">💵</div>
<div class="title">TODAY'S<br>INCOME</div>
</a>

<a class="card" href="license.html">
<div class="icon">🪪</div>
<div class="title">LICENSE</div>
</a>

<a class="card" href="#">
<div class="icon">🌐</div>
<div class="title">COMMUNICATION</div>
</a>

</div>

<button class="logout" id="logoutBtn">
Logout
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBwwSEUizTX5s_PxwQyatOk1LrDiNbaskA",
authDomain: "project-task-79e5b.firebaseapp.com",
projectId: "project-task-79e5b",
storageBucket: "project-task-79e5b.firebasestorage.app",
messagingSenderId: "5023785342",
appId: "1:5023785342:web:570310574c26d18dec532f",
measurementId: "G-77ZCVG3M0L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth,(user)=>{

if(!user){
window.location.href="login.html";
}

});

document.getElementById("logoutBtn").addEventListener("click",async()=>{

await signOut(auth);

window.location.href="login.html";

});

</script></body>
</html>
