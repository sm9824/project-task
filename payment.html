<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Package - PROJECT TASK</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.container{
    width:92%;
    max-width:650px;
    margin:25px auto;
}

.header{
    background:#111827;
    color:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

.header h1{
    margin:0 0 8px;
}

.card{
    background:white;
    margin-top:18px;
    padding:22px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.package{
    text-align:center;
}

.price{
    font-size:38px;
    font-weight:bold;
    margin:15px 0;
}

.feature{
    padding:10px;
    border-bottom:1px solid #eee;
}

button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.status{
    text-align:center;
    font-weight:bold;
    margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📦 PROJECT TASK</h1>
        <p>Package Management</p>
    </div>

    <div class="card package">

        <h2>PROJECT TASK Package</h2>

        <div class="price">৳৬,০০০</div>

        <div class="feature">✅ Package Access</div>
        <div class="feature">✅ Task Access</div>
        <div class="feature">✅ Referral System</div>
        <div class="feature">✅ Commission System</div>
        <div class="feature">✅ Income Dashboard</div>

        <button onclick="buyPackage()">
            📦 Buy Package
        </button>

        <div id="status" class="status"></div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey:"AIzaSyBwwSEUizTX5s_PxwQyatOk1LrDiNbaskA",
    authDomain:"project-task-79e5b.firebaseapp.com",
    projectId:"project-task-79e5b",
    storageBucket:"project-task-79e5b.firebasestorage.app",
    messagingSenderId:"5023785342",
    appId:"1:5023785342:web:570310574c26d18dec532f",
    measurementId:"G-77ZCVG3M0L"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;


onAuthStateChanged(auth, async user => {

    if(!user){
        window.location.href="login.html";
        return;
    }

    currentUser = user;

    try{

        const snap = await getDoc(
            doc(db,"users",user.uid)
        );

        if(snap.exists()){

            const data = snap.data();

            if(data.packageStatus === "active"){

                document.getElementById("status").textContent =
                    "✅ আপনার Package Active আছে।";

                document.querySelector("button").textContent =
                    "💳 Payment Page";

            }

        }

    }catch(error){

        console.error(error);

    }

});


window.buyPackage = function(){

    if(!currentUser){
        return;
    }

    window.location.href="payment.html";

};

</script>

</body>
</html>
