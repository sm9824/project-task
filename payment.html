<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT TASK - Payment</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#2563eb);
padding:20px 15px 30px;
}

.container{
max-width:500px;
margin:auto;
}

.header{
text-align:center;
color:white;
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.box{
background:white;
border-radius:18px;
padding:24px;
box-shadow:0 8px 25px rgba(0,0,0,.20);
}

label{
display:block;
font-weight:bold;
margin:15px 0 7px;
}

select,
input{
width:100%;
padding:13px;
border:1px solid #cbd5e1;
border-radius:10px;
font-size:16px;
}

.package-info{
background:#eff6ff;
padding:15px;
border-radius:12px;
text-align:center;
margin-bottom:15px;
}

.package-name{
font-size:20px;
font-weight:bold;
}

.amount{
font-size:30px;
font-weight:bold;
color:#2563eb;
margin-top:5px;
}

.nagad-box{
background:#f1f5f9;
border-radius:12px;
padding:15px;
margin-top:18px;
text-align:center;
}

.nagad-title{
font-weight:bold;
margin-bottom:8px;
}

.nagad-number{
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

.copy-btn{
border:0;
border-radius:8px;
padding:9px 18px;
background:#475569;
color:white;
font-weight:bold;
cursor:pointer;
}

.submit{
width:100%;
padding:14px;
margin-top:22px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.submit:disabled{
background:#94a3b8;
cursor:not-allowed;
}

.message{
margin-top:15px;
text-align:center;
font-weight:bold;
line-height:1.5;
}

.back{
display:block;
text-align:center;
color:white;
text-decoration:none;
font-weight:bold;
margin-top:20px;
}

.note{
font-size:13px;
color:#64748b;
margin-top:7px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
💳 PAYMENT
</div>

<div class="box">

<label>Select Package</label>

<select id="packageSelect">

<option value="">Select Package</option>

<option value="1" data-amount="1000">
Package 1 — ৳1,000
</option>

<option value="2" data-amount="5000">
Package 2 — ৳5,000
</option>

<option value="3" data-amount="6000">
Package 3 — ৳6,000
</option>

<option value="4" data-amount="10000">
Package 4 — ৳10,000
</option>

<option value="5" data-amount="15000">
Package 5 — ৳15,000
</option>

<option value="6" data-amount="16000">
Package 6 — ৳16,000
</option>

<option value="7" data-amount="20000">
Package 7 — ৳20,000
</option>

<option value="8" data-amount="25000">
Package 8 — ৳25,000
</option>

<option value="9" data-amount="30000">
Package 9 — ৳30,000
</option>

<option value="10" data-amount="50000">
Package 10 — ৳50,000
</option>

</select>


<div class="package-info">

<div class="package-name" id="packageName">
No Package Selected
</div>

<div class="amount" id="amountText">
৳0
</div>

</div>


<div class="nagad-box">

<div class="nagad-title">
Nagad Payment
</div>

<div class="nagad-number" id="nagadNumber">
01XXXXXXXXX
</div>

<button class="copy-btn" id="copyBtn">
COPY NUMBER
</button>

<p class="note">
Payment Type: <b>Send Money</b>
</p>

</div>


<label>Sender Nagad Number</label>

<input
type="text"
id="sender"
placeholder="যে Nagad নম্বর থেকে টাকা পাঠিয়েছেন"
>


<label>Transaction ID</label>

<input
type="text"
id="transactionId"
placeholder="Enter Transaction ID"
>


<button class="submit" id="submitBtn">
SUBMIT PAYMENT
</button>

<div class="message" id="message"></div>

</div>


<a class="back" href="dashboard.html">
← Back to Dashboard
</a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBwwSEUizTX5s_PxwQyatOk1LrDiNbaskA",

authDomain:
"project-task-79e5b.firebaseapp.com",

projectId:
"project-task-79e5b",

storageBucket:
"project-task-79e5b.firebasestorage.app",

messagingSenderId:
"5023785342",

appId:
"1:5023785342:web:570310574c26d18dec532f",

measurementId:
"G-77ZCVG3M0L"

};


/* =========================
   NAGAD NUMBER
   ========================= */

const NAGAD_NUMBER = "01XXXXXXXXX";


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const packageSelect =
document.getElementById("packageSelect");

const packageName =
document.getElementById("packageName");

const amountText =
document.getElementById("amountText");

const nagadNumber =
document.getElementById("nagadNumber");

const copyBtn =
document.getElementById("copyBtn");

const submitBtn =
document.getElementById("submitBtn");

const message =
document.getElementById("message");

const senderInput =
document.getElementById("sender");

const transactionInput =
document.getElementById("transactionId");


nagadNumber.textContent =
NAGAD_NUMBER;


/* =========================
   PACKAGE FROM URL
   ========================= */

const params =
new URLSearchParams(
window.location.search
);

const urlPackage =
params.get("package");

const urlAmount =
params.get("amount");


if(urlPackage && urlAmount){

for(
const option of packageSelect.options
){

if(option.value === urlPackage){

option.selected = true;

break;

}

}

updatePackage();

}


/* =========================
   PACKAGE SELECT
   ========================= */

packageSelect.addEventListener(
"change",
updatePackage
);


function updatePackage(){

const option =
packageSelect.options[
packageSelect.selectedIndex
];


if(!option.value){

packageName.textContent =
"No Package Selected";

amountText.textContent =
"৳0";

return;

}


const amount =
Number(option.dataset.amount);


packageName.textContent =
"Package " + option.value;


amountText.textContent =
"৳" +
amount.toLocaleString("en-US");

}


/* =========================
   COPY NUMBER
   ========================= */

copyBtn.addEventListener(
"click",
async()=>{

try{

await navigator.clipboard.writeText(
NAGAD_NUMBER
);

copyBtn.textContent =
"COPIED ✓";


setTimeout(()=>{

copyBtn.textContent =
"COPY NUMBER";

},2000);


}catch(error){

alert(
"Nagad Number: " +
NAGAD_NUMBER
);

}

});


let currentUser = null;


/* =========================
   AUTH
   ========================= */

onAuthStateChanged(
auth,
(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

currentUser = user;

}
);


/* =========================
   SUBMIT PAYMENT
   ========================= */

submitBtn.addEventListener(
"click",
async()=>{

if(!currentUser){

message.textContent =
"Please login first.";

return;

}


const option =
packageSelect.options[
packageSelect.selectedIndex
];


if(!option.value){

message.textContent =
"Please select a package.";

return;

}


const packageNumber =
Number(option.value);

const amount =
Number(option.dataset.amount);


const sender =
senderInput.value.trim();

const transactionId =
transactionInput.value.trim();


if(!sender){

message.textContent =
"Sender Nagad Number দিন।";

return;

}


if(!transactionId){

message.textContent =
"Transaction ID দিন।";

return;

}


submitBtn.disabled = true;

message.textContent =
"Checking payment...";


try{


/* =========================
   DUPLICATE TRANSACTION
   ========================= */

const paymentRef =
collection(
db,
"payments"
);


const duplicateQuery =
query(
paymentRef,
where(
"transactionId",
"==",
transactionId
)
);


const duplicateSnapshot =
await getDocs(
duplicateQuery
);


if(!duplicateSnapshot.empty){

message.textContent =
"This Transaction ID has already been submitted.";

submitBtn.disabled = false;

return;

}


/* =========================
   SAVE PAYMENT
   ========================= */

await addDoc(
paymentRef,
{

userId:
currentUser.uid,

userEmail:
currentUser.email || "",

packageNumber:
packageNumber,

amount:
amount,

method:
"Nagad",

paymentType:
"Send Money",

nagadNumber:
NAGAD_NUMBER,

sender:
sender,

transactionId:
transactionId,

status:
"pending",

createdAt:
new Date().toISOString()

}
);


message.textContent =
"Payment submitted successfully. Admin approval pending.";

submitBtn.disabled = true;


}catch(error){

console.error(error);

message.textContent =
"Payment failed: " +
error.message;

submitBtn.disabled = false;

}

});

</script>

</body>
</html>
