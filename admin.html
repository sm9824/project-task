<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT TASK Admin</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#2563eb);
padding:25px 15px;
}

.header{
text-align:center;
color:white;
font-size:30px;
font-weight:bold;
margin-bottom:25px;
}

.admin-box{
max-width:600px;
margin:auto;
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.20);
}

h2{
text-align:center;
margin-bottom:20px;
}

.info{
background:#f1f5f9;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.label{
font-size:13px;
color:#64748b;
margin-bottom:5px;
}

.value{
font-weight:bold;
word-break:break-all;
}

.card{
padding:18px;
border:1px solid #e2e8f0;
border-radius:15px;
margin-top:12px;
font-size:18px;
font-weight:bold;
}

.logout{
display:block;
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:12px;
background:#dc2626;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
PROJECT TASK
</div>

<div class="admin-box">

<h2>🛠️ ADMIN PANEL</h2>

<div class="info">
<div class="label">Admin Email</div>
<div class="value" id="adminEmail">Checking...</div>
</div>

<div class="info">
<div class="label">Firebase UID</div>
<div class="value" id="adminUID">Checking...</div>
</div>

<div class="card">
👤 USER MANAGEMENT
</div>

<div class="card">
📦 PACKAGE MANAGEMENT
</div>

<div class="card">
📋 TASK MANAGEMENT
</div>

<div class="card">
💰 COMMISSION / INCOME
</div>

<button class="logout" id="logoutBtn">
Logout
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBwwSEUizTX5s_PxwQyatOk1LrDiNbaskA",
authDomain: "project-task-79e5b.firebaseapp.com",
projectId: "project-task-79e5b",
storageBucket: "project-task-79e5b.firebasestorage.app",
messagingSenderId: "5023785342",
appId: "1:5023785342:web:570310574c26d18dec532f",
measurementId: "G-77ZCVG3M0L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth,(user)=>{

if(!user){
window.location.href="login.html";
return;
}

document.getElementById("adminEmail").innerText =
user.email || "No Email";

document.getElementById("adminUID").innerText =
user.uid;

});

document.getElementById("logoutBtn").addEventListener("click",async()=>{

await signOut(auth);

window.location.href="login.html";

});

</script>

</body>
</html>
