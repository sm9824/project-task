<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - PROJECT TASK</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#2563eb);
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.container{
width:100%;
max-width:500px;
background:white;
border-radius:18px;
padding:30px 25px;
box-shadow:0 10px 35px rgba(0,0,0,.25);
text-align:center
}

.logo{
font-size:28px;
font-weight:bold;
color:#2563eb;
margin-bottom:20px
}

h2{
margin-bottom:10px;
color:#222
}

p{
color:#666;
margin-bottom:10px
}

button{
margin-top:20px;
padding:13px 25px;
border:none;
border-radius:10px;
background:#dc2626;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer
}
</style></head><body><div class="container"><div class="logo">PROJECT TASK</div><h2>Welcome to your Dashboard</h2><p id="email">Loading...</p><button id="logoutBtn">Logout</button>

</div><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBwwSEUizTX5s_PxwQyatOk1LrDiNbaskA",
authDomain: "project-task-79e5b.firebaseapp.com",
projectId: "project-task-79e5b",
storageBucket: "project-task-79e5b.firebasestorage.app",
messagingSenderId: "5023785342",
appId: "1:5023785342:web:570310574c26d18dec532f",
measurementId: "G-77ZCVG3M0L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const email = document.getElementById("email");

onAuthStateChanged(auth, (user) => {

if(user){
email.textContent = "Logged in as: " + user.email;
}else{
window.location.href = "login.html";
}

});

document.getElementById("logoutBtn").addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});

</script></body>
</html>
